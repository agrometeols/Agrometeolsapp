name: Build iOS App
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Capacitor & Dependencies
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/ios
        npx cap init "My App" "com.mydomain.myapp" --web-dir=www
        npx cap add ios

    - name: Install CocoaPods
      run: |
        cd ios/App
        pod install

    - name: Build App
      run: |
        cd ios/App
        xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphoneos CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO
        mkdir Payload
        cp -R Build/Products/Debug-iphoneos/App.app Payload/
        zip -r ../../app.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-debug
        path: app.ipa
