name: Build iOS App
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Capacitor
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/ios
        npx cap init "My App" "com.mydomain.myapp" --web-dir=www
        npx cap add ios

    - name: Disable Code Signing in Pods
      run: |
        echo 'post_install do |installer|' >> ios/App/Podfile
        echo '  installer.pods_project.targets.each do |target|' >> ios/App/Podfile
        echo '    target.build_configurations.each do |config|' >> ios/App/Podfile
        echo '      config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"' >> ios/App/Podfile
        echo '      config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"' >> ios/App/Podfile
        echo '    end' >> ios/App/Podfile
        echo '  end' >> ios/App/Podfile
        echo 'end' >> ios/App/Podfile

    - name: Install CocoaPods
      run: |
        cd ios/App
        pod install

    - name: Build App for Simulator
      run: |
        cd ios/App
        xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
        mkdir Payload
        cp -R Build/Products/Debug-iphonesimulator/App.app Payload/
        zip -r ../../app.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-debug
        path: app.ipa
