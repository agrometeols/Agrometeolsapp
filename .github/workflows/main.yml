name: Build iOS App
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Cordova Project
      run: |
        cordova create myapp com.mydomain.myapp "My App"
        rm -rf myapp/www/*
        cp -R www/* myapp/www/
        cd myapp
        cordova platform add ios

    - name: Build iOS for Simulator
      run: |
        cd myapp
        cordova build ios --emulator --buildConfig=none

    - name: Package into IPA
      run: |
        cd myapp/platforms/ios/build/emulator
        mkdir Payload
        cp -R *.app Payload/
        zip -r ../../../../app.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-debug
        path: app.ipa
