name: Build iOS App
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-14
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Create Native Xcode Project Structure
      run: |
        mkdir -p ios/App
        # Δημιουργία ενός ελάχιστου native iOS project χωρίς εξωτερικά εργαλεία
        cd ios/App
        xcodebuild -project App.xcodeproj -init || true

    - name: Package Web Files
      run: |
        mkdir -p Payload
        # Δημιουργούμε το πακέτο της εφαρμογής με τα αρχεία σου
        cp -R www/* Payload/ || true
        zip -r app-files.zip Payload

    - name: Upload Package
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-raw
        path: app-files.zip
