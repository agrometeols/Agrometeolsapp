name: Build iOS App
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-14
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Create Package Directory
      run: |
        mkdir -p Package/Payload/App.app
        # Αντιγραφή όλων των αρχείων της ιστοσελίδας σου απευθείας μέσα στην εφαρμογή
        cp -R www/* Package/Payload/App.app/
        cd Package
        zip -r ../app-files.zip Payload

    - name: Upload Package
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-raw
        path: app-files.zip
