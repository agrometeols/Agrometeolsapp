name: Build iOS App
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Cordova Project
      run: |
        cordova create myapp com.mydomain.myapp "My App"
        rm -rf myapp/www/*
        cp -R www/* myapp/www/
        cd myapp
        cordova platform add ios

    - name: Compile App Raw Files
      run: |
        cd myapp
        cordova compile ios --emulator --clear

    - name: Prepare Files for Sideloadly
      run: |
        mkdir Payload
        cp -R myapp/platforms/ios/build/emulator/*.app Payload/ || cp -R myapp/platforms/ios/build/shared/emulator/*.app Payload/ || cp -R myapp/platforms/ios/build/Outputs/emulator/*.app Payload/ || true
        zip -r app-files.zip Payload

    - name: Upload Package
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-raw
        path: app-files.zip
