name: Build iOS App
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Pack Web Files Directly
      run: |
        mkdir -p Payload/App.app
        cp -R www/* Payload/App.app/
        zip -r app-files.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-raw
        path: app-files.ipa
