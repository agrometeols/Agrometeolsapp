name: Build iOS App
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Capacitor
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/ios
        npx cap init "My App" "com.mydomain.myapp" --web-dir=www
        npx cap add ios

    - name: Install CocoaPods
      run: |
        cd ios/App
        pod install

    - name: Bypass Apple Restrictions
      run: |
        cd ios/App
        sed -i '' 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = "1234567890";/' App.xcodeproj/project.pbxproj
        sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/' App.xcodeproj/project.pbxproj

    - name: Build App Archive
      run: |
        cd ios/App
        xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE_SPECIFIER=""

    - name: Package into IPA
      run: |
        cd ios/App
        mkdir Payload
        cp -R Build/Products/Debug-iphoneos/App.app Payload/
        zip -r ../../app.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-debug
        path: app.ipa
