workflows:
  my-ios-workflow:
    name: Flutter iOS Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
    triggering:
      events:
        - push
    scripts:
      - name: Set up Flutter Project
        script: |
          flutter create . --org com.mydomain.myapp --project-name myapp
          rm -rf web
      - name: Build iOS Simulator App
        script: |
          flutter build ios --simulator --no-codesign
    artifacts:
      - build/ios/iphonesimulator/*.app
